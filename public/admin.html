<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin — Chá de Panela</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #1a2d16 0%, #253d20 40%, #1e3519 70%, #111e0f 100%);
      position: relative;
      overflow: hidden;
    }

    /* Ornamentos de fundo */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 55% 50% at 10% 60%, rgba(90,138,80,0.2) 0%, transparent 55%),
        radial-gradient(ellipse 40% 40% at 90% 20%, rgba(200,169,110,0.12) 0%, transparent 50%),
        radial-gradient(ellipse 30% 30% at 55% 90%, rgba(74,122,64,0.15) 0%, transparent 50%);
      pointer-events: none;
    }

    /* SVG decorativo */
    .deco-leaf {
      position: absolute;
      opacity: 0.05;
      color: #6aaa60;
      pointer-events: none;
    }

    /* Card de login */
    .login-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 400px;
      margin: 1rem;
      background: rgba(255,255,255,0.97);
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 25px 60px rgba(0,0,0,0.4),
        0 0 0 1px rgba(200,169,110,0.2);
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Faixa topo */
    .card-top-bar {
      height: 4px;
      background: linear-gradient(90deg, #3d6b35, #c8a96e, #e8c96e, #c8a96e, #3d6b35);
      background-size: 200% auto;
      animation: shimmer 4s linear infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% center; }
      100% { background-position: -200% center; }
    }

    .card-body {
      padding: 2.5rem 2rem 2rem;
    }

    /* Header */
    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .leaf-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #253d20, #3d6b35);
      border-radius: 50%;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 16px rgba(37,61,32,0.3);
    }

    .card-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      font-weight: 600;
      color: #1a2d16;
      line-height: 1.15;
      margin-bottom: 0.3rem;
    }

    .card-header p {
      font-size: 0.8rem;
      color: #9a8268;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 500;
    }

    /* Alerta de erro */
    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    /* Form */
    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #7a6b58;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1.5px solid #ede9e0;
      border-radius: 12px;
      background: #fcf9f5;
      color: #27201a;
      font-size: 0.9rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #c8a96e;
      box-shadow: 0 0 0 3px rgba(200,169,110,0.15);
    }
    input::placeholder { color: #c4b89e; }

    /* Botão */
    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, #253d20, #3d6b35);
      color: #fff;
      font-weight: 600;
      font-size: 0.88rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 0.5rem;
      letter-spacing: 0.03em;
      transition: filter 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(37,61,32,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    button[type="submit"]:hover { filter: brightness(1.1); box-shadow: 0 6px 20px rgba(37,61,32,0.4); }
    button[type="submit"]:active { transform: scale(0.98); }

    /* Volta */
    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.8rem;
      color: #9a8268;
      text-decoration: none;
      transition: color 0.2s;
    }
    .back-link:hover { color: #3d6b35; }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.5rem 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, #ede9e0, transparent);
    }
    .divider span { font-size: 0.7rem; color: #c4b89e; white-space: nowrap; }
  </style>
</head>
<body>

  <!-- Folhas decorativas -->
  <svg class="deco-leaf" style="top:-5%;left:-8%;width:350px;height:350px;" viewBox="0 0 200 200" fill="currentColor">
    <path d="M100,5 Q170,20 195,100 Q170,180 100,195 Q30,180 5,100 Q30,20 100,5Z"/>
  </svg>
  <svg class="deco-leaf" style="bottom:-10%;right:-5%;width:300px;height:300px;" viewBox="0 0 200 200" fill="currentColor">
    <ellipse cx="100" cy="100" rx="90" ry="70"/>
  </svg>

  <div class="login-card">
    <div class="card-top-bar"></div>
    <div class="card-body">

      <div class="card-header">
        <div class="leaf-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </div>
        <h1>Área Administrativa</h1>
        <p>Chá de Panela · Gabriela &amp; Rodolfo</p>
      </div>

      <!-- Erro de login -->
      <div id="alert-error" class="alert-error" style="display:none;">
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Usuário ou senha incorretos. Tente novamente.
      </div>

      <form action="/admin/login" method="POST">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required autofocus/>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required/>
        </div>
        <button type="submit">
          <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          Entrar no Painel
        </button>
      </form>

      <a href="/" class="back-link">← Voltar para a lista de presentes</a>
    </div>
  </div>

  <script>
    // Mostra alerta de erro se veio da URL com ?error=1
    if (new URLSearchParams(window.location.search).get('error') === '1') {
      document.getElementById('alert-error').style.display = 'flex';
    }
  </script>
</body>
</html>
